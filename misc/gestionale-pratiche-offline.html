dren:[(0,m.jsx)("style",{children:`
        @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

        .app-root {
          --ink: #1C2B39; --ink-soft: #445064;
          --paper: #F5F2EA; --surface: #FFFFFF; --line: #E2DDD0;
          --bronze: #A8763F; --bronze-dark: #8B5F30; --bronze-bg: #F1E6D6;
          --sage: #4B7A63; --sage-bg: #E4EDE7;
          --amber: #BD8A3B; --amber-bg: #F5EAD7;
          --rust: #AC4F3B; --rust-bg: #F3E2DD;
          --slate: #6B7785; --slate-bg: #E9E7E1;
          font-family: 'Inter', sans-serif;
          color: var(--ink);
          background: var(--paper);
          display: flex;
          min-height: 100vh;
          width: 100%;
        }
        .app-root * { box-sizing: border-box; }
        .app-root h1 { font-family: 'Source Serif 4', serif; font-size: 26px; font-weight: 700; margin: 0; }
        .app-root h3 { font-family: 'Source Serif 4', serif; font-size: 18px; margin: 0; }
        .mono { font-family: 'IBM Plex Mono', monospace; }

        /* Sidebar */
        .sidebar {
          width: 232px; flex-shrink: 0; background: var(--ink); color: #EDEAE1;
          display: flex; flex-direction: column; padding: 22px 14px;
        }
        .brand { padding: 4px 10px 22px 10px; border-bottom: 1px solid rgba(255,255,255,0.12); margin-bottom: 18px; }
        .brand-title { font-family: 'Source Serif 4', serif; font-size: 20px; font-weight: 700; color: #F5F2EA; }
        .brand-sub { font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: #A8A297; margin-top: 4px; }
        .nav-item {
          display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
          color: #C9C4B8; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 2px;
          border: none; background: none; text-align: left; width: 100%;
        }
        .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .nav-item.active { background: var(--bronze); color: #fff; }
        .sidebar-footer { margin-top: auto; padding: 12px 10px 4px; font-size: 11px; color: #8A8578; display: flex; align-items: center; gap: 6px; }

        /* Main */
        .main { flex: 1; padding: 34px 40px; overflow-y: auto; }
        .page-header {
          display: flex; justify-content: space-between; align-items: flex-end;
          border-bottom: 3px solid var(--ink); padding-bottom: 14px; margin-bottom: 8px; position: relative;
        }
        .page-header::after { content: ''; position: absolute; left: 0; right: 0; bottom: -7px; height: 1px; background: var(--line); }
        .page-subtitle { color: var(--ink-soft); font-size: 13.5px; margin-top: 4px; }
        .main > div > .page-header + * { margin-top: 24px; }

        /* KPI */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin: 22px 0 28px; }
        .kpi-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; gap: 12px; align-items: center; }
        .kpi-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .kpi-icon-ink { background: var(--slate-bg); color: var(--ink); }
        .kpi-icon-amber { background: var(--amber-bg); color: var(--amber); }
        .kpi-icon-bronze { background: var(--bronze-bg); color: var(--bronze-dark); }
        .kpi-icon-sage { background: var(--sage-bg); color: var(--sage); }
        .kpi-icon-rust { background: var(--rust-bg); color: var(--rust); }
        .kpi-value { font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; line-height: 1.2; }
        .kpi-label { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

        /* Charts */
        .charts-row { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 24px; }
        .cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; }
        .chart-card, .table-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
        .chart-title { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.03em; }

        /* Table */
        .table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        .table th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); font-weight: 600; padding: 8px 10px; border-bottom: 1.5px solid var(--line); }
        .table td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
        .table tbody tr:last-child td { border-bottom: none; }
        .table tbody tr:hover { background: rgba(168,118,63,0.05); }
        .num { text-align: right; }
        .muted { color: var(--ink-soft); }
        .muted-small { color: var(--ink-soft); font-size: 11.5px; margin-top: 2px; }
        .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
        .link-btn { background: none; border: none; padding: 0; font: inherit; color: var(--ink); font-weight: 600; cursor: pointer; text-align: left; }
        .link-btn:hover { color: var(--bronze-dark); text-decoration: underline; }
        .pending-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); margin-left: 6px; }

        /* Badges & tags */
        .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; border: 1.4px solid; }
        .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
        .badge.stato-aperta { background: var(--slate-bg); color: var(--slate); border-color: var(--slate); }
        .badge.stato-istruttoria { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
        .badge.stato-approvata { background: var(--bronze-bg); color: var(--bronze-dark); border-color: var(--bronze); }
        .badge.stato-erogata { background: var(--sage-bg); color: var(--sage); border-color: var(--sage); }
        .badge.stato-respinta { background: var(--rust-bg); color: var(--rust); border-color: var(--rust); }
        .tipo-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-soft); font-weight: 500; }

        /* Buttons */
        .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; padding: 9px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer; border: 1px solid transparent; font-family: 'Inter', sans-serif; }
        .btn-primary { background: var(--ink); color: #fff; }
        .btn-primary:hover { background: #142030; }
        .btn-ghost { background: none; border-color: var(--line); color: var(--ink); }
        .btn-ghost:hover { background: var(--slate-bg); }
        .btn-danger { background: var(--rust); color: #fff; }
        .btn-small { padding: 6px 12px; font-size: 12.5px; }
        .icon-btn { background: none; border: none; color: var(--ink-soft); cursor: pointer; padding: 6px; border-radius: 6px; display: flex; }
        .icon-btn:hover { background: var(--slate-bg); color: var(--ink); }
        .icon-btn-danger:hover { background: var(--rust-bg); color: var(--rust); }

        /* Filters */
        .filters-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .search-box { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; flex: 1; min-width: 220px; color: var(--ink-soft); }
        .search-box input { border: none; outline: none; background: none; font-size: 13.5px; width: 100%; color: var(--ink); font-family: 'Inter'; }
        .select-filter { min-width: 150px; }
        .filter-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--bronze-bg); color: var(--bronze-dark); padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; margin-bottom: 14px; }
        .filter-chip button { background: none; border: none; color: inherit; cursor: pointer; display: flex; }

        /* Empty state */
        .empty-state { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 12px; padding: 48px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .empty-state-compact { padding: 28px; }
        .empty-icon { width: 48px; height: 48px; border-radius: 50%; background: var(--slate-bg); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
        .empty-title { font-family: 'Source Serif 4', serif; font-size: 16px; font-weight: 700; }
        .empty-subtitle { color: var(--ink-soft); font-size: 13px; max-width: 340px; margin-bottom: 10px; }

        /* Modal / Slideover */
        .overlay { position: fixed; inset: 0; background: rgba(28,43,57,0.45); display: flex; z-index: 50; }
        .modal { background: var(--surface); border-radius: 12px; margin: auto; width: 520px; max-width: 92vw; max-height: 88vh; overflow-y: auto; }
        .modal-wide { width: 620px; }
        .modal-header, .slideover-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
        .modal-body { padding: 22px 24px 26px; }
        .slideover { background: var(--surface); width: 440px; max-width: 92vw; margin-left: auto; height: 100vh; overflow-y: auto; }
        .slideover-body { padding: 22px 24px 30px; }
        .slideover-subtitle { color: var(--ink-soft); font-size: 12.5px; margin-top: 3px; }

        /* Forms */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
        .field-span { grid-column: 1 / -1; }
        .field-label { font-weight: 600; color: var(--ink-soft); font-size: 12px; }
        .form-error { display: flex; align-items: center; gap: 8px; background: var(--rust-bg); color: var(--rust); padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
        .import-box { background: var(--bronze-bg); border: 1.5px dashed var(--bronze); border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; }
        .import-box-title { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; color: var(--bronze-dark); margin-bottom: 4px; }
        .import-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .file-input-label { position: relative; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 8px 12px; font-size: 12.5px; cursor: pointer; color: var(--ink-soft); max-width: 230px; overflow: hidden; }
        .file-input-label span, .file-input-label { white-space: nowrap; text-overflow: ellipsis; }
        .file-input-label input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
        .import-ok { display: flex; align-items: center; gap: 8px; background: var(--sage-bg); color: var(--sage); padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; margin-top: 10px; }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .dynlist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
        .dynlist-row { display: flex; gap: 8px; align-items: center; }
        .input, .select, .textarea {
          border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; font-size: 13.5px;
          font-family: 'Inter', sans-serif; background: #fff; color: var(--ink); outline: none;
        }
        .input:focus, .select:focus, .textarea:focus { border-color: var(--bronze); }
        .textarea { resize: vertical; }
        .input-date { max-width: 140px; }
        .input-prefix { display: flex; align-items: center; gap: 6px; }
        .input-prefix span { color: var(--ink-soft); font-size: 13px; }
        .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
        .select-add { display: flex; gap: 6px; align-items: center; }
        .select-add .select { flex: 1; }
        .select-add-btn { border: 1px solid var(--line); border-radius: 7px; flex-shrink: 0; }
        .select-add-inline { display: flex; gap: 6px; align-items: center; }
        .select-add-inline .input { flex: 1; }
        .list-manager-add { display: flex; gap: 8px; margin-top: 10px; }
        .list-manager-add .input { flex: 1; }
        .remun-add { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .remun-add .select { min-width: 140px; }
        .remun-add .input-prefix .input { width: 90px; }
        .remun-edit { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
        .remun-edit .select { width: 90px; }
        .remun-edit .input { width: 80px; }

        .section-divider { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--bronze-dark); margin: 22px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--bronze-bg); }
        .ricavi-block { display: flex; flex-direction: column; gap: 12px; }
        .ricavo-row { display: flex; flex-direction: column; gap: 6px; background: var(--paper); border-radius: 8px; padding: 10px 12px; }
        .ricavo-row-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .hint-chip { border: 1px dashed var(--bronze); background: none; color: var(--bronze-dark); font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
        .hint-chip:hover { background: var(--bronze-bg); }
        .ricavo-label { font-size: 12.5px; font-weight: 600; }
        .ricavo-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .ricavo-controls .input-prefix .input { width: 110px; }
        .ricavo-total { display: flex; justify-content: space-between; padding: 10px 12px; background: var(--bronze-bg); border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--bronze-dark); }
        .ricavo-total strong { font-family: 'IBM Plex Mono', monospace; }
        .ricavo-total-muted { background: var(--slate-bg); color: var(--ink-soft); }
        .ricavo-row-empty { display: flex; justify-content: space-between; padding: 6px 4px; font-size: 13px; }
        .ricavo-row-detail { display: flex; justify-content: space-between; align-items: center; background: var(--paper); border-radius: 8px; padding: 10px 12px; }
        .ricavo-controls-detail { display: flex; align-items: center; gap: 10px; }
        .chip-toggle { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 11.5px; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
        .chip-toggle-on { background: var(--sage-bg); border-color: var(--sage); color: var(--sage); }

        .detail-grid { display: flex; flex-direction: column; gap: 9px; }
        .detail-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; justify-content: space-between; }
        .detail-row svg { color: var(--ink-soft); flex-shrink: 0; }
        .detail-row-inline { display: flex; gap: 10px; align-items: center; }
        .detail-note { background: var(--paper); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
        .mini-list { display: flex; flex-direction: column; gap: 8px; }
        .mini-list-item { display: flex; justify-content: space-between; align-items: center; background: var(--paper); border-radius: 8px; padding: 9px 12px; }
        .mini-list-title { font-size: 13px; font-weight: 600; }
        .mini-list-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; display: flex; gap: 4px; align-items: center; }
        .mini-list-right { display: flex; align-items: center; gap: 10px; }

        .confirm-inline, .confirm-wrap { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--rust-bg); color: var(--rust); font-size: 13px; border-radius: 0 0 10px 10px; }
        .confirm-inline span { flex: 1; }

        @media (max-width: 860px) {
          .app-root { flex-direction: column; }
          .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 10px 16px; }
          .brand { display: none; }
          .sidebar-footer { display: none; }
          .nav-item { width: auto; }
          .main { padding: 20px; }
          .form-grid { grid-template-columns: 1fr; }
          .charts-row { grid-template-columns: 1fr; }
          .cols-2 { grid-template-columns: 1fr; }
        }
