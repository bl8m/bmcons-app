services:
  mongodb:
    image: mongo:7
    container_name: bmcons-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-Password123}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-bmcons}
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1
    container_name: bmcons-mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-Password123}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-Password123}
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"

  backend:
    build:
      context: ./backend
      target: dev
    container_name: bmcons-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      # Sovrascrive il MONGO_URI del .env (pensato per l'uso senza Docker)
      # componendolo dalle stesse credenziali di mongodb qui sopra: evita di
      # doverle tenere sincronizzate manualmente in due punti.
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-Password123}@mongodb:27017/${MONGO_DB_NAME:-bmcons}?authSource=admin
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: bmcons-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./.env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: npm run dev -- --host

volumes:
  mongo-data:
  backend-node-modules:
  frontend-node-modules:
